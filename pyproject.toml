[project]
name = "call_me_maybe"
version = "0.1.0"
description = "Function calling for small LLMs via constrained decoding"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.14.0",
    "llm-sdk",
    "pydantic>=2.13.4",
    "numpy>=2.0.0",
]

[tool.uv.workspace]
members = [
    "llm_sdk",
]

[tool.uv.sources]
llm-sdk = { workspace = true }

[[tool.mypy.overrides]]
module = "llm_sdk.*"
ignore_errors = true
